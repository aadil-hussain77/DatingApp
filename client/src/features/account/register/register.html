<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">
        SignUp
    </div>

    <div class="card-body w-full">
        <form #registrationForm class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
            <input type="text" class="input w-full" name="email" placeholder="Email" [(ngModel)]="registerCred.email">
            <input type="text" class="input w-full" name="displayName" placeholder="Display Name"
                [(ngModel)]="registerCred.displayName" />
            <input type="password" class="input w-full" name="password" placeholder="Password"
                [(ngModel)]="registerCred.password" />
            <div class="flex items-center justify-end gap-3">
                <button class="btn" type="button" (click)="cancel()">Cancel</button>
                <button class="btn btn-primary" type="submit">Register</button>
            </div>
        </form>
    </div>

</div>
